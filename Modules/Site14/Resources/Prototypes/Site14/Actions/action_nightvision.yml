- type: entity
  parent: BaseAction
  id: ActionToggleNightVision
  name: Toggle the nightvision
  description: Allows you to see even in complete darkness.
  components:
  - type: InstantAction
    event: !type:ToggleActionEvent
  - type: Action
    icon:
      sprite: Site14/Clothing/Head/Helmets/mtfnvg.rsi
      state: icon-up
    iconOn:
      sprite: Site14/Clothing/Head/Helmets/mtfhelm.rsi
      state: icon
    useDelay: 0.25
