- type: entity
  id: BaseViewconeEffect
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: ViewconeOccludable
    inverted: true
    overrideBaseAlpha: true
  - type: Sprite
    sprite: Site14/Effects/viewcone_effects.rsi
    drawdepth: Effects
    noRot: true
    color: '#FFFFFF00' # 0 alpha by default, will get overriden by setalpha overlay
    loop: false
  - type: Transform
    anchored: true
  - type: TimedDespawn
    lifetime: 3.0
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ViewconeEffectFootstep
  parent: BaseViewconeEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: footstep

- type: entity
  id: ViewconeEffectAttack
  parent: BaseViewconeEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: attack

# TODO UNUSED
- type: entity
  id: ViewconeEffectForcefield
  parent: BaseViewconeEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: forcefield

# TODO UNUSED
- type: entity
  id: ViewconeEffectTalk
  parent: BaseViewconeEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: talk
